[project]
name = "chordarium-mcp"
version = "0.1.0"
description = "Chordarium Studio MCP adapter: exposes core tools to Claude Desktop, Claude Code and LM Studio"
requires-python = ">=3.11"
dependencies = ["chordarium-core", "mcp>=2.0", "httpx>=0.27"]

[project.scripts]
chordarium-mcp = "chordarium_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
