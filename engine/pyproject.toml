[project]
name = "chordarium-engine"
version = "0.1.0"
description = "Chordarium Studio engine: chord parsing, theory and rule-based arrangement generators"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "mido>=1.3", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6"]

[project.scripts]
chordarium-studio = "chordarium_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chordarium_engine = ["styles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
