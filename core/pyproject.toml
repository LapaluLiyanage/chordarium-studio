[project]
name = "chordarium-core"
version = "0.1.0"
description = "Chordarium Studio local companion service (REST + WebSocket hub, AI providers, tool loop)"
requires-python = ">=3.11"
dependencies = ["chordarium-engine", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "websockets>=12", "keyring>=25"]

[project.optional-dependencies]
remote = ["python-rtmidi>=1.5"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
chordarium-core = "chordarium_core.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
